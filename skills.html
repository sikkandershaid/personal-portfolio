<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skills Section</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #0d1b2a url('unnamed (1).jpg') center/cover no-repeat;
      color: #fff;
      overflow-x: hidden;
    }

    .section {
      padding: 80px 20px;
      text-align: center;
      position: relative;
    }

    .icon-large {
      font-size: 100px;
      color: #00e0c7;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h2 {
      font-size: 40px;
      margin: 10px 0;
      color: #00e2ff;
      animation: fadeInDown 1s ease forwards;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .subtext {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 40px;
    }

    .skill-boxes {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
      margin-bottom: 60px;
    }

    .box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(6px);
      padding: 25px 35px;
      border-radius: 12px;
      width: 220px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .box:hover {
      transform: translateY(-10px);
      box-shadow: 0 10px 25px rgba(0, 255, 255, 0.2);
    }

    .box-title {
      font-weight: 600;
      margin-top: 10px;
      font-size: 18px;
    }

    .tech-icons {
      display: flex;
      justify-content: center;
      gap: 50px;
      margin-top: 40px;
    }

    .tech-item {
      text-align: center;
      animation: popIn 0.8s ease forwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.5); }
      to { opacity: 1; transform: scale(1); }
    }

    .circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      margin: auto;
      transition: 0.3s ease;
    }

    .circle:hover {
      transform: translateY(-10px) scale(1.1);
      background: #00e0c7;
      color: #000;
    }
  </style>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <section class="section">
    <div class="icon-large">&lt;/&gt;</div>
    <h2>Skills</h2>
    <p class="subtext">I am striving to never stop learning and improving</p>

    <div class="skill-boxes">
      <div class="box">
        <i class="fas fa-laptop-code fa-2x"></i>
        <p class="box-title">Web Development</p>
        <span>HTML · CSS · JS · REACT</span>
      </div>

      <div class="box">
        <i class="fas fa-mobile-alt fa-2x"></i>
        <p class="box-title">App Development</p>
        <span>iOS · Android</span>
      </div>
    </div>

    <div class="tech-icons">
      <div class="tech-item">
        <div class="circle"><i class="fab fa-html5"></i></div>
        <p>HTML</p>
      </div>

      <div class="tech-item">
        <div class="circle"><i class="fab fa-css3-alt"></i></div>
        <p>CSS</p>
      </div>

      <div class="tech-item">
        <div class="circle"><i class="fab fa-js"></i></div>
        <p>JS</p>
      </div>

      <div class="tech-item">
        <div class="circle"><i class="fab fa-react"></i></div>
        <p>REACT</p>
      </div>
    </div>

  </section>

</body>
</html>
