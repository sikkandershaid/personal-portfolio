<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MixItUp Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .controls button {
            padding: 8px 15px;
            margin: 5px;
            border: none;
            background: #333;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }
        .controls button.active {
            background: #ff5722;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }

        .mix {
            width: 200px;
            height: 150px;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h2>MixItUp Filtering Demo</h2>

    <div class="controls">
        <button data-filter="all" class="active">All</button>
        <button data-filter=".cat1">Category 1</button>
        <button data-filter=".cat2">Category 2</button>
    </div>

    <div class="container">
        <div class="mix cat1">Item 1</div>
        <div class="mix cat2">Item 2</div>
        <div class="mix cat1">Item 3</div>
        <div class="mix cat2">Item 4</div>
        <div class="mix cat1">Item 5</div>
        <div class="mix cat2">Item 6</div>
    </div>

    <script src="assets/js/mixitup.min.js"></script>
    <script>
        var mixer = mixitup('.container');

        // Active button effect
        const buttons = document.querySelectorAll('.controls button');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
    </script>
</body>
</html>
