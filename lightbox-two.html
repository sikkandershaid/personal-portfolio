<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;600;800&display=swap');

        :root {
            --accent: #00f2ff;
            --bg: #030303;
            --card-bg: rgba(15, 15, 15, 0.4);
        }

        body {
            background-color: var(--bg);
            color: #fff;
            margin: 0;
            padding: 100px 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
        }

        /* --- Next Gen Glass Card --- */
        .skill-card {
            position: relative;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
        }

        /* কার্ডের পেছনে মুভিং গ্রেডিয়েন্ট (অ্যানিমেটেড বর্ডার লুক) */
        .skill-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(0, 242, 255, 0.12) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .skill-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(0, 242, 255, 0.5);
            background: rgba(20, 20, 20, 0.6);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 242, 255, 0.1);
        }

        .skill-card:hover::before {
            opacity: 1;
        }

        /* আইকন অ্যানিমেশন */
        .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            font-size: 1.5rem;
            color: var(--accent);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.4s ease;
        }

        .skill-card:hover .icon-box {
            transform: rotateY(180deg);
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 25px var(--accent);
        }

        .category-name {
            font-family: 'Syncopate', sans-serif;
            font-size: 1rem;
            margin-bottom: 35px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* প্রোগ্রেস সেকশন */
        .skill-wrap {
            margin-bottom: 25px;
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            color: rgba(255,255,255,0.7);
        }

        .bar-container {
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #0077ff, var(--accent));
            border-radius: 10px;
            position: relative;
            transition: 2s cubic-bezier(0.1, 0.5, 0.5, 1);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        /* প্রোগ্রেসবারের মাথায় স্পার্কল ডট */
        .bar-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translate(50%, -50%);
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent);
        }

        @media (max-width: 768px) {
            .skills-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="skills-grid">
            
            <div class="skill-card">
                <div class="icon-box"><i class="fas fa-laptop-code"></i></div>
                <h3 class="category-name">Frontend</h3>
                
                <div class="skill-wrap">
                    <div class="skill-header"><span>React JS</span><span>95%</span></div>
                    <div class="bar-container"><div class="bar-fill" data-progress="95%"></div></div>
                </div>

                <div class="skill-wrap">
                    <div class="skill-header"><span>Tailwind CSS</span><span>98%</span></div>
                    <div class="bar-container"><div class="bar-fill" data-progress="98%"></div></div>
                </div>
            </div>

            <div class="skill-card">
                <div class="icon-box"><i class="fas fa-server"></i></div>
                <h3 class="category-name">Backend</h3>
                
                <div class="skill-wrap">
                    <div class="skill-header"><span>Node.js</span><span>90%</span></div>
                    <div class="bar-container"><div class="bar-fill" data-progress="90%"></div></div>
                </div>

                <div class="skill-wrap">
                    <div class="skill-header"><span>MongoDB</span><span>85%</span></div>
                    <div class="bar-container"><div class="bar-fill" data-progress="85%"></div></div>
                </div>
            </div>

            <div class="skill-card">
                <div class="icon-box"><i class="fas fa-video"></i></div>
                <h3 class="category-name">Creative</h3>
                
                <div class="skill-wrap">
                    <div class="skill-header"><span>Premiere Pro</span><span>92%</span></div>
                    <div class="bar-container"><div class="bar-fill" data-progress="92%"></div></div>
                </div>

                <div class="skill-wrap">
                    <div class="skill-header"><span>After Effects</span><span>80%</span></div>
                    <div class="bar-container"><div class="bar-fill" data-progress="80%"></div></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ১. কার্ডের ভেতরে মাউস মুভমেন্ট ইফেক্ট (Radial Glow)
        document.querySelectorAll('.skill-card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / card.clientWidth) * 100;
                const y = ((e.clientY - rect.top) / card.clientHeight) * 100;
                card.style.setProperty('--x', `${x}%`);
                card.style.setProperty('--y', `${y}%`);
            });
        });

        // ২. স্ক্রল করলে প্রোগ্রেস বার অ্যানিমেশন শুরু হওয়া
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) {
                    const bars = entry.target.querySelectorAll('.bar-fill');
                    bars.forEach(bar => {
                        bar.style.width = bar.getAttribute('data-progress');
                    });
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.skill-card').forEach(card => observer.observe(card));
    </script>
</body>
</html>
