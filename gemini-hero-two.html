<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Blue Cyberpunk Hero</title>

    <style>
        /* =======================
       GLOBAL STYLES
    ======================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #00000a;
            overflow-x: hidden;
        }

        /* Define Dark Blue Neon Color Palette */
        :root {
            --dark-bg: #00000a;
            --neon-blue: #007bff;
            /* A vibrant dark blue */
            --light-blue: #4d94ff;
            /* A lighter blue for highlights */
            --text-color: #e6f0ff;
            /* Off-white text */
        }

        /* =======================
       HERO SECTION
    ======================= */
        .hero {
            height: 100vh;
            width: 100%;
            position: relative;
            color: var(--text-color);
            overflow: hidden;
            /* Radial gradient background based on the Dark Blue theme */
            background: radial-gradient(circle at center, rgba(0, 123, 255, 0.3) 0%, rgba(0, 10, 40, 0.9) 60%, var(--dark-bg) 100%);
        }

        /* Navigation */
        .nav {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            position: relative;
        }

        .nav .logo {
            font-size: 26px;
            font-weight: 800;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            letter-spacing: 1px;
        }

        .nav ul {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav ul li a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 17px;
            transition: 0.3s;
        }

        .nav ul li a:hover {
            color: var(--light-blue);
            text-shadow: 0 0 5px var(--light-blue);
        }

        /* Hero Center Content */
        .hero-content {
            width: 90%;
            max-width: 800px;
            margin: 140px auto 0;
            text-align: center;
            position: relative;
            z-index: 5;
        }

        .hero-content h1 {
            font-size: 5rem;
            font-weight: 900;
            /* Adjusting shadow for dark blue neon */
            text-shadow: 0 0 30px var(--neon-blue), 0 0 50px rgba(0, 123, 255, 0.5);
            line-height: 1.1;
        }

        .hero-content p {
            margin-top: 20px;
            font-size: 1.15rem;
            opacity: 0.9;
        }

        .btn {
            display: inline-block;
            margin-top: 40px;
            padding: 15px 55px;
            /* Gradient for the button */
            background: linear-gradient(135deg, var(--neon-blue), #0056b3);
            color: var(--text-color);
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            border: 2px solid var(--neon-blue);
            /* Button shadow for neon glow */
            box-shadow: 0 0 15px var(--neon-blue);
            transition: all 0.4s ease;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.05);
            background: linear-gradient(135deg, var(--light-blue), var(--neon-blue));
            box-shadow: 0 0 25px var(--light-blue), 0 0 40px rgba(0, 123, 255, 0.8);
        }

        /* Floating Neon Icons */
        .icon {
            position: absolute;
            width: 70px;
            opacity: 0.4;
            /* Applying dark blue filter */
            filter: drop-shadow(0 0 15px var(--neon-blue));
            animation: float 4s ease-in-out infinite;
            z-index: 4;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* Cyberpunk Circuit Floor (Using the Dark Blue PNG) */
        .circuit-floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 400px;
            /* এখানে আপনার dark blue circuit PNG-এর URL ব্যবহার করা হয়েছে */
            background-image: url('http://googleusercontent.com/image_generation_content/0');
            background-size: 100% auto;
            background-repeat: no-repeat;
            background-position: center bottom;
            opacity: 0.7;
            /* Subtle blue shadow at the bottom */
            box-shadow: 0 0 50px var(--neon-blue);
            z-index: 3;
        }

        /* City Silhouette */
        .city {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background: var(--dark-bg);
            /* Add a subtle blue glow at the top edge of the city */
            box-shadow: 0 -10px 40px rgba(0, 123, 255, 0.5);
            z-index: 2;
        }
    </style>
</head>

<body>

    <section class="hero">

        <nav class="nav">
            <div class="logo">Cyber Blue</div>

            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Network</a></li>
                <li><a href="#">Data</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f4bb.svg" class="icon"
            style="left: 10%; top: 30%;">
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/2728.svg" class="icon"
            style="right: 15%; top: 25%; animation-delay: 1.5s;">
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f680.svg" class="icon"
            style="left: 80%; top: 40%; animation-delay: 0.5s;">

        <div class="circuit-floor"></div>

        <div class="hero-content">
            <h1>The Future is Already Coded_</h1>
            <p>Dive into the digital frontier with cutting-edge technology and a vision for the decentralized world.</p>
            <a href="#" class="btn">Start Journey</a>
        </div>

        <div class="city"></div>

    </section>

</body>

</html>
