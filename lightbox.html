<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Plus+Jakarta+Sans:wght@300;600&display=swap");

      body {
        background-color: #050505;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        font-family: "Syncopate", sans-serif;
      }

      .header-container {
        text-align: center;
      }

      /* মেইন টেক্সট কন্টেইনার */
      #text-container {
        font-size: 5rem;
        font-weight: 700;
        text-transform: uppercase;
        color: #fff;
        display: flex;
        justify-content: center;
        gap: 0.1em;
        overflow: hidden;
        height: 1.2em;
      }

      /* প্রতিটি অক্ষরের জন্য স্টাইল */
      .char {
        display: inline-block;
        transform: translateY(100%);
        opacity: 0;
        filter: blur(10px);
        transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.8s linear, filter 0.8s linear;
      }

      /* যখন অক্ষর দৃশ্যমান হবে */
      .char.visible {
        transform: translateY(0);
        opacity: 1;
        filter: blur(0);
      }

      /* যখন অক্ষর চলে যাবে */
      .char.out {
        transform: translateY(-100%);
        opacity: 0;
        filter: blur(10px);
      }

      .info-box {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .line {
        width: 0px;
        height: 1px;
        background: linear-gradient(90deg, transparent, #00f2ff, transparent);
        transition: width 1s ease-in-out;
      }

      .sub-title {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        letter-spacing: 10px;
        opacity: 0;
        transform: translateY(10px);
        animation: fadeInSub 2s forwards 0.5s;
      }

      @keyframes fadeInSub {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 768px) {
        #text-container {
          font-size: 2.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="header-container">
      <div id="text-container"></div>

      <div class="info-box">
        <div class="line" id="glow-line"></div>
        <p class="sub-title">System Evolution</p>
      </div>
    </div>

    <script>
      const container = document.getElementById("text-container");
      const line = document.getElementById("glow-line");
      const phrases = ["About Us", "Freelancer", "Editor"];
      let phraseIndex = 0;

      function createText(text) {
        container.innerHTML = "";
        // Split each character into a separate span
        text.split("").forEach((char, i) => {
          const span = document.createElement("span");
          span.textContent = char === " " ? "\u00A0" : char;
          span.className = "char";
          container.appendChild(span);

          // Delay to display the characters one by one
          setTimeout(() => {
            span.classList.add("visible");
          }, i * 50);
        });

        // Make the bottom line larger
        line.style.width = "200px";
      }

      function removeText() {
        const chars = document.querySelectorAll(".char");
        chars.forEach((span, i) => {
          setTimeout(() => {
            span.classList.remove("visible");
            span.classList.add("out");
          }, i * 30);
        });

        line.style.width = "0px";
      }

      function cycle() {
        createText(phrases[phraseIndex]);

        // Remove the text after 4 seconds
        setTimeout(() => {
          removeText();
          phraseIndex = (phraseIndex + 1) % phrases.length;

          // Pause before starting new text
          setTimeout(cycle, 1000);
        }, 3500);
      }

      // Start
      window.onload = () => {
        cycle();
      };
    </script>
  </body>
</html>
