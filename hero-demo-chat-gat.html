<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Hero Banner</title>

  <style>
    /* =======================
       GLOBAL STYLES
    ======================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #05000c;
      overflow-x: hidden;
    }

    /* =======================
       HERO SECTION
    ======================= */
    .hero {
      height: 100vh;
      width: 100%;
      position: relative;
      color: #fff;
      overflow: hidden;
      background: radial-gradient(circle at center, rgba(0, 230, 255, 0.45) 0%, rgba(0, 10, 40, 0.95) 60%, #000414 100%);
    }

    /* Navigation */
    .nav {
      width: 90%;
      margin: 0 auto;
      padding: 25px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav .logo {
      font-size: 24px;
      font-weight: bold;
      color: #00e6ff;
      letter-spacing: 1px;
    }

    .nav ul {
      display: flex;
      gap: 40px;
      list-style: none;
    }

    .nav ul li a {
      color: #e0ffff;
      text-decoration: none;
      font-size: 17px;
      transition: 0.3s;
    }

    .nav ul li a:hover {
      color: #00e6ff;
    }

    /* Hero Center Content */
    .hero-content {
      width: 80%;
      margin: 140px auto 0;
      text-align: center;
    }

    .hero-content h1 {
      font-size: 64px;
      font-weight: bold;
      text-shadow: 0 0 25px #00e6ff;
    }

    .hero-content p {
      margin-top: 18px;
      font-size: 18px;
      opacity: 0.85;
    }

    .btn {
      display: inline-block;
      margin-top: 38px;
      padding: 14px 50px;
      background: linear-gradient(135deg, #00e6ff, #00b8cc);
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      border-radius: 10px;
      box-shadow: 0 0 18px #00e6ff;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.07);
      box-shadow: 0 0 28px #00e6ff, 0 0 40px #00b8cc;
    }

    /* Floating Neon Icons */
    .icon {
      position: absolute;
      width: 70px;
      opacity: 0.35;
      filter: drop-shadow(0 0 18px #00e6ff);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-18px);
      }

      100% {
        transform: translateY(0);
      }
    }

    /* Cyberpunk Floor Lines */
    .floor {
      position: absolute;
      bottom: 170px;
      width: 100%;
      height: 200px;
      background: linear-gradient(to top, rgba(0, 230, 255, 0.3), transparent);
      opacity: 0.4;
      transform: perspective(300px) rotateX(60deg);
      background-size: 40px 40px;
      background-image:
        linear-gradient(#00e6ff 1px, transparent 1px),
        linear-gradient(90deg, #00e6ff 1px, transparent 1px);
    }

    /* City Bottom */
    .city {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 180px;
      background: linear-gradient(to top, #00b8cc, #00e6ff, #008f99);
      clip-path: polygon(0 100%, 0 40%, 10% 45%, 10% 55%, 18% 55%, 18% 30%,
          28% 30%, 28% 60%, 38% 60%, 38% 45%, 48% 45%, 48% 70%,
          60% 70%, 60% 50%, 72% 50%, 72% 65%, 82% 65%, 82% 42%,
          92% 42%, 92% 55%, 100% 55%, 100% 100%);
      opacity: 0.85;
      box-shadow: 0 0 50px #00e6ff;
    }
  </style>
</head>

<body>

  <section class="hero">

    <!-- Navigation -->
    <nav class="nav">
      <div class="logo">Programming Hero</div>

      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Success</a></li>
      </ul>
    </nav>

    <!-- Floating Icons -->
    <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f4bb.svg" class="icon"
      style="left: 10%; top: 35%;">
    <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/2728.svg" class="icon"
      style="right: 15%; top: 30%; animation-delay: 1s;">
    <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f680.svg" class="icon"
      style="left: 80%; top: 50%; animation-delay: 2s;">

    <!-- Floor Grid -->
    <div class="floor"></div>

    <!-- Center Content -->
    <div class="hero-content">
      <h1>Let’s Code_Your Career</h1>
      <p>We're on a mission to provide personalized learning and empower individuals to kick-start their careers.</p>
      <a href="#" class="btn">Explore</a>
    </div>

    <!-- Neon City -->
    <div class="city"></div>

  </section>

</body>

</html>
