<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animated Portfolio Hero Section</title>
    <style>
        :root {
            --size: 250px;
            /* Main size variable */
            --ring-color: rgba(0, 230, 255, 0.95);
            /* Bright Neon Cyan/Blue */
            --bg: #071428;
            /* Deep Dark Blue Background */
            --text-light: #e6f7ff;
            /* Very light bluish white */
        }

        /* --- GLOBAL STYLES & RESET --- */
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: var(--text-light);
        }

        /* --- CONTENT WRAPPER & BACKGROUND ANIMATION --- */
        .content-wrap {
            width: 100%;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            
            /* Enhanced Background Gradient */
            background: radial-gradient(1200px 600px at 10% 10%, rgba(10, 25, 40, 0.35), transparent 10%),
                linear-gradient(180deg, #03111a 0%, #071428 50%, #04101b 100%);
            
            /* Background Animation Setup */
            background-size: 200% 200%;
            animation: backgroundPan 120s linear infinite alternate;
        }

        /* Darker cinematic overlay (for depth) */
        .content-wrap::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 10% 10%, rgba(0, 0, 0, 0.9), transparent 35%),
                radial-gradient(circle at 90% 90%, rgba(0, 0, 0, 0.85), transparent 40%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.9), transparent 50%, rgba(0, 0, 0, 0.95) 100%);
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* --- STAGE (Image and Rings Container) --- */
        .stage {
            width: var(--size);
            height: var(--size);
            position: relative;
            display: grid;
            place-items: center;
            
            /* Stronger Glow and Shadow */
            filter: drop-shadow(0 0 15px var(--ring-color)) drop-shadow(0 0 25px rgba(0, 0, 0, 0.6));
            
            /* Stage Floating Animation */
            animation: floatStage 10s ease-in-out infinite alternate;
        }

        /* --- PROFILE IMAGE & GLASS EFFECT --- */
        .photo {
            width: 70%;
            height: 70%;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 40;
            
            /* Enhanced Glass/Frosted Effect */
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(2px);
            box-shadow: 
                inset 0 4px 20px rgba(255, 255, 255, 0.05),
                0 8px 40px rgba(0, 0, 0, 0.8);
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* --- RINGS & SVG ANIMATION --- */
        .rings {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
        }

        .rotate-slow {
            animation: rot 16s linear infinite;
            transform-origin: center center;
        }

        /* --- TEXT ELEMENTS & ENTRANCE ANIMATION --- */
        .caption, .title, .subheading, .skill-tag {
            opacity: 0; /* Hide initially for entrance animation */
            animation: fadeInSlide 0.7s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            z-index: 3;
        }

        /* Caption / tagline */
        .caption {
            font-size: 14px;
            color: rgba(230, 247, 255, 0.85);
            letter-spacing: 0.6px;
            text-align: center;
            opacity: 0.95;
            animation-delay: 1.5s;
        }

        /* Frontend developer title */
        .title {
            margin-top: 20px;
            font-size: 24px;
            font-weight: 700;
            color: #00e6ff;
            letter-spacing: 1px;
            /* Enhanced Text Glow */
            text-shadow: 0 0 8px rgba(0, 230, 255, 0.5), 0 0 15px rgba(0, 230, 255, 0.2);
            animation-delay: 1.8s;
        }

        /* --- SKILLS CONTAINER & TAGS --- */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            max-width: 80%;
            font-size: 14px;
            color: rgba(230, 247, 255, 0.8);
            letter-spacing: 0.5px;
            animation-delay: 2.1s;
        }

        .skill-tag {
            padding: 4px 10px;
            border: 1px solid rgba(0, 230, 255, 0.4);
            border-radius: 5px;
            font-size: 12px;
            color: var(--ring-color);
            background: rgba(0, 230, 255, 0.05);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s;
            animation-delay: 2.3s; /* Optional: Stagger tags if desired */
        }

        .skill-tag:hover {
            background: rgba(0, 230, 255, 0.2);
        }

        /* --- KEYFRAMES --- */

        /* 1. SVG Ring Rotation */
        @keyframes rot {
            to {
                transform: rotate(360deg);
            }
        }

        /* 2. Background Slow Pan */
        @keyframes backgroundPan {
            0% {
                background-position: 0% 0%;
            }

            100% {
                background-position: 100% 100%;
            }
        }

        /* 3. Stage Floating */
        @keyframes floatStage {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-8px);
            }
        }

        /* 4. Text Entrance (Fade-in and Slide-up) */
        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <section class="content-wrap">
        <div class="stage" role="img" aria-label="Animated rings around center image">

            <svg class="rings" viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet"
                xmlns="http://www.w3.org/2000/svg">
                <g class="rotate-slow" stroke="var(--ring-color)" stroke-width="4" stroke-linecap="round">
                    <path d="M 250 40 A 210 210 0 0 1 460 250" fill="none" opacity="0.9">
                        <animate attributeName="stroke-dasharray" values="30 20; 10 10; 30 20" dur="3s"
                            repeatCount="indefinite" />
                        <animate attributeName="stroke-dashoffset" values="0; -60" dur="3s" repeatCount="indefinite" />
                    </path>
                </g>
            </svg>

            <div class="photo" title="Profile Image">
                <img src="my.png" alt="Profile Image" /> 
                </div>

        </div>

        <div class="caption">Born to run — Run for dream</div>

        <div class="title">Frontend Developer</div>

        <div class="skills-container subheading">
            <span class="skill-tag" style="animation-delay: 2.3s;">HTML</span>
            <span class="skill-tag" style="animation-delay: 2.4s;">CSS</span>
            <span class="skill-tag" style="animation-delay: 2.5s;">JavaScript</span>
            <span class="skill-tag" style="animation-delay: 2.6s;">React</span>
            <span class="skill-tag" style="animation-delay: 2.7s;">Tailwind CSS</span>
            <span class="skill-tag" style="animation-delay: 2.8s;">MERN Stack</span>
        </div>
    </section>
</body>

</html>
