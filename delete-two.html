<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Thumbnail</title>
  <style>
    .video-container {
      position: relative;
      width: 600px;
      max-width: 100%;
      cursor: pointer;
    }

    .thumbnail {
      width: 100%;
      display: block;
      border-radius: 10px;
    }

    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn::before {
      content: "";
      border-style: solid;
      border-width: 12px 0 12px 20px;
      border-color: transparent transparent transparent white;
    }

    video {
      width: 100%;
      display: none;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="video-container" onclick="playVideo()">
  <!-- Thumbnail -->
  <img src="thumbnail.jpg" class="thumbnail" id="thumb">

  <!-- Play Button -->
  <div class="play-btn" id="playBtn"></div>

  <!-- Video -->
  <video id="video" controls>
    <source src="video.mp4" type="video/mp4">
    Your browser does not support video.
  </video>
</div>

<script>
  function playVideo() {
    document.getElementById("thumb").style.display = "none";
    document.getElementById("playBtn").style.display = "none";

    const video = document.getElementById("video");
    video.style.display = "block";
    video.play();
  }
</script>

</body>
</html>
