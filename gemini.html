<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Section</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #15191d;
            /* Dark background matching image */
            font-family: 'Poppins', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        :root {
            --primary-color: #00f2c3;
            /* The Teal/Cyan color */
            --text-muted: #8892b0;
            --border-color: #2d3436;
        }

        .contact-section {
            width: 100%;
            max-width: 900px;
            padding: 50px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- ADVANCED TOP MOUSE ANIMATION (Updated) --- */
        .scroll-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .mouse {
            width: 26px;
            height: 42px;
            border: 2px solid var(--primary-color);
            border-radius: 20px;
            position: relative;
            margin-bottom: 10px;
            /* মাউসটি এখন ভাসবে ও গ্লো করবে */
            box-shadow: 0 0 15px rgba(0, 242, 195, 0.2);
            animation: mouseFloat 4s ease-in-out infinite;
        }

        .wheel {
            width: 4px;
            height: 4px;
            background-color: var(--primary-color); /* Updated to primary color for better sync */
            border-radius: 50%;
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            /* চাকা নামার অ্যাডভান্স অ্যানিমেশন */
            animation: wheelDrop 2s cubic-bezier(0.15, 0.41, 0.69, 0.94) infinite;
        }

        .dashed-line {
            width: 2px;
            height: 70px;
            margin-top: 5px;
            /* ড্যাশ তৈরি করার টেকনিক */
            background-image: linear-gradient(to bottom, var(--primary-color) 50%, transparent 50%);
            background-size: 2px 15px;
            /* ড্যাশের সাইজ */
            background-repeat: repeat-y;
            position: relative;
            /* এনিমেশন */
            animation: moveDashes 0.8s linear infinite;
        }

        /* নিচে ছোট বিন্দুটি স্থির থাকবে (dashed-line এর আগের::after রুল রিপ্লেস করা হলো) */
        .dashed-line::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 6px;
            height: 6px;
            background-color: var(--primary-color);
            box-shadow: 0 0 5px var(--primary-color);
        }

        /* মাউসের অ্যাডভান্স কীফ্রেম */
        @keyframes mouseFloat {
            0%, 100% {
                transform: translateY(0);
                box-shadow: 0 0 15px rgba(0, 242, 195, 0.2);
            }

            50% {
                transform: translateY(-6px);
                /* একটু উপরে উঠবে */
                box-shadow: 0 0 25px rgba(0, 242, 195, 0.5);
                /* গ্লো বাড়বে */
            }
        }

        /* চাকা পড়ার অ্যাডভান্স কীফ্রেম (ড্রপ + স্ট্রেচ) */
        @keyframes wheelDrop {
            0% {
                top: 5px;
                opacity: 0;
                height: 4px;
                /* শুরুতে গোল */
            }

            10% {
                opacity: 1;
                height: 6px;
                /* নামার সময় একটু লম্বা হবে */
            }

            100% {
                top: 25px;
                opacity: 0;
                height: 4px;
            }
        }

        /* ড্যাশ লাইনের কীফ্রেম (যেমন আছে) */
        @keyframes moveDashes {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 30px;
                /* ড্যাশগুলো নিচে নামবে */
            }
        }

        /* --- Typography --- */
        .section-title {
            font-size: 3rem;
            color: var(--primary-color);
            font-weight: 500;
            letter-spacing: 1px;
        }
        
        /* ... (বাকি CSS অপরিবর্তিত) ... */
        .title-underline {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 15px;
        }

        .title-underline .dot {
            width: 6px;
            height: 6px;
            background-color: var(--primary-color);
            border-radius: 50%;
        }

        .title-underline .line {
            width: 150px;
            height: 2px;
            background-color: var(--primary-color);
        }

        .subtitle {
            font-family: 'Fira Code', monospace;
            /* Monospace for typewriter look */
            color: white;
            font-size: 0.9rem;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }

        /* --- CTA Banner --- */
        .cta-banner {
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 5px 20px 5px 20px;
            /* Slight custom shape */
            margin-bottom: 50px;
            font-family: 'Fira Code', monospace;
            box-shadow: 0 0 10px rgba(0, 242, 195, 0.1);
            transition: all 0.3s ease;
        }

        .cta-banner:hover {
            box-shadow: 0 0 20px rgba(0, 242, 195, 0.3);
            transform: translateY(-2px);
        }

        /* --- Form Styles --- */
        .contact-form {
            width: 100%;
            text-align: left;
        }

        .input-row {
            display: flex;
            gap: 50px;
            margin-bottom: 40px;
        }

        .input-group {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            color: var(--primary-color);
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #555;
            padding: 10px 0;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group textarea {
            resize: none;
        }

        /* Animation on Focus */
        .input-group input:focus,
        .input-group textarea:focus {
            border-bottom: 1px solid var(--primary-color);
        }

        .full-width {
            margin-bottom: 50px;
        }

        /* --- Submit Button --- */
        .submit-btn {
            background-color: var(--primary-color);
            color: #15191d;
            border: none;
            padding: 12px 40px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 auto;
            /* Center the button */
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 242, 195, 0.4);
        }

        .submit-btn i {
            font-size: 0.9rem;
        }

        /* --- Responsive Design --- */
        @media (max-width: 768px) {
            .input-row {
                flex-direction: column;
                gap: 30px;
            }

            .section-title {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>

    <section class="contact-section">
        <div class="scroll-indicator">
            <div class="mouse">
                <div class="wheel"></div>
            </div>
            <div class="dashed-line"></div>
        </div>

        <h1 class="section-title">Contact</h1>
        <div class="title-underline">
            <span class="dot"></span>
            <span class="line"></span>
            <span class="dot"></span>
        </div>

        <p class="subtitle">I'm currently available for freelance work</p>

        <div class="cta-banner">
            Send Me A Message
        </div>

        <form class="contact-form">
            <div class="input-row">
                <div class="input-group">
                    <label>Your name *</label>
                    <input type="text" placeholder="Enter your name" required>
                    <span class="focus-border"></span>
                </div>
                <div class="input-group">
                    <label>Your email *</label>
                    <input type="email" placeholder="Enter your email" required>
                    <span class="focus-border"></span>
                </div>
            </div>

            <div class="input-group full-width">
                <label>Your message *</label>
                <textarea rows="1" placeholder="Enter your needs" required></textarea>
                <span class="focus-border"></span>
            </div>

            <button type="submit" class="submit-btn">
                Send Message <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </section>

</body>

</html>
