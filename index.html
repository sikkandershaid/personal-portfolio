<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="viewport"

    />
    <title>BookClub | Home Page</title>
    <link rel="icon" href="fav-icon.png" type="image/gif" sizes="16x16" />

  <body class="site">
    <header class="header">
      <div class="container">
        <div class="d-none d-lg-block">
          <div class="header__menu">

            <div class="header__logo-box">
              <a href="index.html" class="logo"
                ><img src="assets/img/logo-two.png" alt="Company Logo"

            <!-- NavBar  -->
            <nav class="navigation">

                <li class="navigation__item">

          <div class="header__menu">

                /></a>
              </div>
              <!-- mobile logo -->
              <div class="mobile-canvas-close close-mobile-menu">
                <p class="sidebar__menu-title">Menu</p>
              </div>
              <div class="mobile-main-menu">
                <button class="close-btn" id="closeBtn">
                  <i class="fa-solid fa-xmark"></i>

                <nav class="navigation">
                  <ul class="navigation__list">
                    <li class="navigation__item">

                    </li>
                    <li class="navigation__item">
                      <a href="#" class="navigation__link">Team</a>
                    </li>
                  </ul>
                </nav>
                <div class="login-button">
                  <a href="tel:01786293291">Log in</a>
                </div>
              </div>
              <!-- mobile main menu -->
            </div>
          </div>
        </div>

    <main class="site__content"></main>
    <!-- footer area -->
    <footer class="footer section__padding">
      <div class="container">
        </div>
      </div>

    <!-- Js File -->
    <script src="js/bootstrap.min.js"></script>
    <script src="js/scrollreveal.min.js"></script>
