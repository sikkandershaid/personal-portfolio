<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smooth Animated Center Image with Rings</title>
  <style>
    :root {
      --size: 250px;
      --ring-color: rgba(0, 230, 255, 0.95);
      --bg: #071428;
    }

    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .content-wrap {
      width: 100%;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(10, 25, 40, 0.35), transparent 10%),
        linear-gradient(180deg, #03111a 0%, #071428 50%, #04101b 100%);
      background-position: center;
      background-size: cover;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: #e6f7ff;
      position: relative;
      overflow: hidden;
      flex-direction: column;
    }

    /* Darker cinematic overlay */
    .content-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 10% 10%, rgba(0, 0, 0, 0.9), transparent 35%),
        radial-gradient(circle at 90% 90%, rgba(0, 0, 0, 0.85), transparent 40%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.9), transparent 50%, rgba(0, 0, 0, 0.95) 100%);
      pointer-events: none;
      mix-blend-mode: overlay;
    }





    .stage {
      width: var(--size);
      height: var(--size);
      position: relative;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 0.6));
    }

    .photo {
      width: 70%;
      height: 70%;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
      box-shadow: inset 0 2px 10px rgba(255, 255, 255, 0.02), 0 6px 30px rgba(0, 0, 0, 0.6);
    }


    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .rings {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .caption {
      font-size: 14px;
      color: rgba(230, 247, 255, 0.85);
      letter-spacing: 0.6px;
      text-align: center;
      opacity: 0.95;
    }

    /* Frontend developer title */
    .title {
      margin-top: 20px;
      font-size: 24px;
      font-weight: 700;
      color: #00e6ff;
      letter-spacing: 1px;
      z-index: 3;
    }

    /* Skills / subheading */
    .subheading {
      margin-top: 8px;
      font-size: 14px;
      color: rgba(230, 247, 255, 0.8);
      letter-spacing: 0.5px;
      z-index: 3;
    }

    .rotate-slow {
      animation: rot 16s linear infinite;
      transform-origin: center center;
    }

    @keyframes rot {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <section class="content-wrap">
    <div class="stage" role="img" aria-label="Animated rings around center image">

      <!-- Neon ring -->
      <svg class="rings" viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <g class="rotate-slow" stroke="var(--ring-color)" stroke-width="4" stroke-linecap="round">
          <path d="M 250 40 A 210 210 0 0 1 460 250" fill="none" opacity="0.9">
            <animate attributeName="stroke-dasharray" values="30 20; 10 10; 30 20" dur="3s" repeatCount="indefinite" />
            <animate attributeName="stroke-dashoffset" values="0; -60" dur="3s" repeatCount="indefinite" />
          </path>
        </g>
      </svg>

      <!-- Circular glass photo -->
      <div class="photo" title="Profile Image">
        <img src="my.png" alt="Profile Image" />
      </div>

    </div>

    <!-- Caption / tagline -->
    <div class="caption">Born to run — Run for dream</div>

    <!-- Frontend Developer title -->
    <div class="title">Frontend Developer</div>

    <!-- Subheading / skills -->
    <div class="subheading">HTML | CSS | JavaScript | React | Tailwind CSS | MERN Stack</div>
  </section>



</body>

</html>
